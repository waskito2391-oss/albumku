<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Albumku thumbnail</title>
<style>
  :root { --accent: #e3b341; --ink: #ededed; --muted: #a9a9a9; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body {
    background:
      radial-gradient(700px 520px at 78% 40%, rgba(227, 179, 65, 0.16), transparent 70%),
      radial-gradient(900px 600px at 0% 100%, rgba(255, 255, 255, 0.04), transparent 60%),
      #151515;
    font-family: "Segoe UI Variable Text", "Segoe UI", sans-serif;
    color: var(--ink);
    position: relative;
  }
  .left { position: absolute; left: 64px; top: 58px; width: 520px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand img { width: 64px; height: 64px; }
  .brand span { font-family: Bahnschrift, sans-serif; font-weight: 600; font-size: 30px; letter-spacing: -0.01em; }
  h1 {
    margin-top: 44px;
    font-family: "IvyMode", Georgia, serif;
    font-weight: 400;
    font-size: 66px;
    line-height: 1.02;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .lede { margin-top: 18px; font-size: 21px; line-height: 1.45; color: var(--muted); max-width: 30ch; }
  ul { list-style: none; padding: 0; margin-top: 30px; display: grid; gap: 14px; }
  li { display: flex; align-items: baseline; gap: 14px; font-size: 21px; }
  li b { font-family: Bahnschrift, sans-serif; font-weight: 600; color: var(--accent); min-width: 92px; font-size: 23px; }
  .foot { position: absolute; left: 64px; bottom: 44px; font-size: 16px; color: #8c8c8c; }
  .shot {
    position: absolute; left: 560px; top: 96px; width: 900px;
    border-radius: 14px; overflow: hidden;
    transform: perspective(1800px) rotateY(-14deg) rotateX(4deg);
    transform-origin: left center;
    box-shadow: 0 40px 90px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.08);
  }
  .shot img { display: block; width: 100%; }
  .badge {
    position: absolute; right: 70px; bottom: 54px;
    background: var(--accent); color: #1c1606;
    font-family: Bahnschrift, sans-serif; font-weight: 600; font-size: 22px;
    padding: 12px 20px; border-radius: 8px;
    box-shadow: 0 14px 30px rgba(0, 0, 0, 0.45);
  }
</style>
</head>
<body>
  <div class="shot"><img src="app_shot.png" alt="Tampilan editor Albumku"></div>
  <div class="left">
    <div class="brand"><img src="icon-1024.png" alt=""><span>Albumku</span></div>
    <h1>Album foto jadi dalam hitungan menit</h1>
    <p class="lede">Seret foto sesi, pilih template, export siap cetak.</p>
    <ul>
      <li><b>4.000+</b> template grid otomatis</li>
      <li><b>Wajah</b> tidak terpotong, crop pintar</li>
      <li><b>300 dpi</b> JPG, PDF &amp; TIFF untuk lab</li>
    </ul>
  </div>
  <div class="foot">Album cetak, magazine, story &amp; feed Instagram. Untuk Windows.</div>
  <div class="badge">Pakai font Adobe-mu</div>
</body>
</html>
