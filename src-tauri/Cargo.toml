[package]
name = "albumku"
version = "0.3.0"
description = "ALBUMKU - penyusun album foto, magazine, story & feed"
authors = ["ALBUMKU"]
edition = "2021"

[lib]
name = "albumku_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25.6", default-features = false, features = ["jpeg", "png", "webp", "rayon"] }
kamadak-exif = "0.6"
chrono = { version = "0.4", default-features = false, features = ["std"] }
rayon = "1"
ttf-parser = "0.25"
jpeg-encoder = "0.6"
percent-encoding = "2"
tiff = "0.9"
rustface = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi"] }

# decode foto besar tetap cepat walau build debug
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.albumku]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
